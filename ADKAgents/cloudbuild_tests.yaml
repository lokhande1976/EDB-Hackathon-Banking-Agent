steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.tests
      - -t
      - us-central1-docker.pkg.dev/ltc-ipnihack-prj-11/agent-repo/tests:latest
      - .

images:
  - us-central1-docker.pkg.dev/ltc-ipnihack-prj-11/agent-repo/tests:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
